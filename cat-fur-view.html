<!doctype html><meta charset="utf-8"><title>cat.fbx 털 입힌 시안</title>
<body style="margin:0;background:#b9ab97;font-family:sans-serif">
<div style="position:fixed;top:12px;left:12px;display:flex;gap:8px;align-items:center;z-index:2">
<button id="bFur">털 결 끄기</button>
<button id="bSpin">회전 멈춤</button>
<span style="font-size:13px;color:#3d3226">화면을 끌면 방향이 바뀝니다</span>
</div>
<canvas id="cv" style="width:100vw;height:100vh;display:block;touch-action:none;cursor:grab"></canvas>
<script type="module">
import * as T from 'three'
import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js'
import { mergeVertices } from 'three/examples/jsm/utils/BufferGeometryUtils.js'

const N = 10
const cv = document.getElementById('cv')
const R = new T.WebGLRenderer({ canvas: cv, antialias: true })
R.setPixelRatio(Math.min(2, devicePixelRatio))
R.toneMapping = T.ACESFilmicToneMapping
R.toneMappingExposure = 0.85
R.shadowMap.enabled = true
R.shadowMap.type = T.PCFSoftShadowMap
const S = new T.Scene()
S.background = new T.Color('#b9ab97')
const cam = new T.PerspectiveCamera(30, 1, 0.01, 100)
cam.position.set(0, 0.7, 3.3)
cam.lookAt(0, 0.48, 0)
S.add(new T.HemisphereLight('#fff8ee', '#a89880', 1.5))
const sun = new T.DirectionalLight('#fff1dc', 3.2)
sun.position.set(2.5, 4, 3)
sun.castShadow = true
sun.shadow.mapSize.set(2048, 2048)
Object.assign(sun.shadow.camera, { left: -1.5, right: 1.5, top: 1.5, bottom: -1.5 })
sun.shadow.bias = -0.0005
sun.shadow.normalBias = 0.02
S.add(sun)
const fill = new T.DirectionalLight('#cfe0ff', 0.8)
fill.position.set(-3, 2, -2)
S.add(fill)
const floor = new T.Mesh(new T.CircleGeometry(6, 48), new T.MeshStandardMaterial({ color: '#8a745c', roughness: 1 }))
floor.rotation.x = -Math.PI / 2
floor.receiveShadow = true
S.add(floor)

const pivot = new T.Group()
S.add(pivot)
const shells = []
const state = { yaw: -0.75, spin: true, fur: true, ready: false }
window.__fur = { state, cam, pivot }

const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t) }

// 털 겹 재질. 겹마다 표면에서 조금씩 더 밀어내고 점 무늬로 일부만 남긴다.
function shellMat(i) {
  const k = (i + 1) / N
  const m = new T.MeshStandardMaterial({ color: '#fbfaf7', roughness: 1, emissive: new T.Color('#fff6ea'), emissiveIntensity: 0.16, vertexColors: true })
  m.onBeforeCompile = (s) => {
    s.uniforms.uK = { value: k }
    s.vertexShader = 'attribute float aFur;uniform float uK;varying vec3 vP;\n' + s.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvP=position;transformed+=normalize(normal)*aFur*uK;')
    s.fragmentShader = 'uniform float uK;varying vec3 vP;\nfloat h3(vec3 p){p=fract(p*0.3183099+0.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}\n' + s.fragmentShader.replace('#include <color_fragment>', '#include <color_fragment>\nfloat hh=h3(floor(vP*400.0));if(hh<uK*0.88)discard;diffuseColor.rgb*=mix(0.8,1.0,uK);')
  }
  m.customProgramCacheKey = () => 'shell' + i
  return m
}

const EYE = { x: 0.042, y: 0.642, z: 0.44 }
window.__eye = EYE
function addEye(mesh, side, ray) {
  const out = new T.Vector3(side * 0.55, 0.1, 0.83).normalize()
  ray.set(new T.Vector3(side * EYE.x, EYE.y, EYE.z).addScaledVector(out, 0.3), out.clone().negate())
  const hit = ray.intersectObject(mesh, false)[0]
  if (!hit) return null
  const n = hit.face.normal.clone()
  const eye = new T.Group()
  eye.position.copy(hit.point).addScaledVector(n, -0.0005)
  eye.quaternion.setFromUnitVectors(new T.Vector3(0, 0, 1), n)
  const inner = new T.Group()
  inner.rotation.z = side * 0.3
  inner.scale.set(1, 0.68, 1)
  eye.add(inner)
  const part = (r, mat, z, sx, sy, sz) => { const o = new T.Mesh(new T.SphereGeometry(r, 20, 16), mat); o.position.z = z; o.scale.set(sx, sy, sz); inner.add(o); return o }
  part(0.0165, new T.MeshStandardMaterial({ color: '#2c5f9e', roughness: 0.5 }), 0, 1, 1, 0.4)
  part(0.015, new T.MeshPhysicalMaterial({ color: '#5aa9f0', roughness: 0.08, clearcoat: 1, emissive: new T.Color('#2a78c8'), emissiveIntensity: 0.3 }), 0.002, 1, 1, 0.45)
  part(0.009, new T.MeshStandardMaterial({ color: '#101216', roughness: 0.15 }), 0.0055, 0.5, 1.25, 0.4)
  const hl = part(0.0038, new T.MeshBasicMaterial({ color: '#ffffff' }), 0.0085, 1, 1, 0.5)
  hl.position.x = 0.005
  hl.position.y = 0.006
  return { eye, point: hit.point.toArray().map((v) => +v.toFixed(3)) }
}

new FBXLoader().load('/models/characters/skater-cat/cat.fbx', (obj) => {
  let src
  obj.traverse((o) => { if (o.isMesh) src = o })
  obj.updateMatrixWorld(true)
  let geo = src.geometry.clone()
  geo.applyMatrix4(src.matrixWorld)
  geo.deleteAttribute('normal'); geo.deleteAttribute('uv'); geo.deleteAttribute('color')
  geo.clearGroups()
  // 전체 높이를 1로 맞추고 발바닥을 바닥에 놓는다.
  geo.computeBoundingBox()
  const b = geo.boundingBox, size = b.getSize(new T.Vector3()), c = b.getCenter(new T.Vector3())
  geo.translate(-c.x, -b.min.y, -c.z)
  geo.scale(1 / size.y, 1 / size.y, 1 / size.y)
  // 같은 자리의 꼭짓점을 합쳐야 털 겹이 갈라지지 않는다.
  geo = mergeVertices(geo, 1e-4)
  geo.computeVertexNormals()

  const p = geo.attributes.position, nrm = geo.attributes.normal
  const fur = new Float32Array(p.count), col = new Float32Array(p.count * 3)
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i)
    const head = sm(0.3, 0.37, z) * sm(0.5, 0.54, y)
    const leg = 1 - sm(0.2, 0.34, y)
    const ear = sm(0.7, 0.73, y) * sm(0.3, 0.33, z)
    let len = 0.022
    len = len + (0.008 - len) * leg
    len = len + (0.0055 - len) * head
    len = len + (0.004 - len) * ear
    len *= 0.15 + 0.85 * sm(0.014, 0.04, Math.hypot(Math.abs(x) - 0.036, y - 0.641, z - 0.432))
    fur[i] = len
    const pink = ear * sm(0.35, 0.7, nrm.getZ(i)) * (1 - sm(0.045, 0.06, Math.abs(Math.abs(x) - 0.085) + 0.03))
    col[i * 3] = 1
    col[i * 3 + 1] = 1 - 0.2 * pink
    col[i * 3 + 2] = 1 - 0.16 * pink
  }
  geo.setAttribute('aFur', new T.BufferAttribute(fur, 1))
  geo.setAttribute('color', new T.BufferAttribute(col, 3))

  const base = new T.Mesh(geo, new T.MeshPhysicalMaterial({ color: '#fbfaf7', roughness: 0.9, sheen: 1, sheenRoughness: 0.5, sheenColor: new T.Color('#ffffff'), emissive: new T.Color('#fff6ea'), emissiveIntensity: 0.16, vertexColors: true }))
  base.castShadow = true
  pivot.add(base)
  pivot.rotation.y = 0
  pivot.updateMatrixWorld(true)
  for (let i = 0; i < N; i++) { const s = new T.Mesh(geo, shellMat(i)); base.add(s); shells.push(s) }

  const ray = new T.Raycaster()
  const eyes = [-1, 1].map((s) => addEye(base, s, ray)).filter(Boolean)
  eyes.forEach((e) => base.add(e.eye))
  ray.set(new T.Vector3(0, 0.585, 0.8), new T.Vector3(0, 0, -1))
  const nh = ray.intersectObject(base, false)[0]
  if (nh) {
    const nose = new T.Mesh(new T.SphereGeometry(0.009, 12, 10), new T.MeshPhysicalMaterial({ color: '#eba0ac', roughness: 0.3, clearcoat: 0.6 }))
    nose.position.copy(nh.point).add(new T.Vector3(0, 0.004, -0.003))
    nose.scale.set(1.3, 0.85, 0.7)
    base.add(nose)
  }
  Object.assign(state, { ready: true, verts: p.count, eyes: eyes.map((e) => e.point), nose: nh ? nh.point.toArray().map((v) => +v.toFixed(3)) : null })
}, undefined, (e) => { state.error = String(e) })

let drag = false, lx = 0
cv.addEventListener('pointerdown', (e) => { drag = true; lx = e.clientX; cv.setPointerCapture(e.pointerId) })
cv.addEventListener('pointermove', (e) => { if (drag) { state.yaw += (e.clientX - lx) * 0.012; lx = e.clientX } })
cv.addEventListener('pointerup', () => { drag = false })
const bF = document.getElementById('bFur'), bS = document.getElementById('bSpin')
bF.onclick = () => { state.fur = !state.fur; bF.textContent = state.fur ? '털 결 끄기' : '털 결 켜기' }
bS.onclick = () => { state.spin = !state.spin; bS.textContent = state.spin ? '회전 멈춤' : '회전 시작' }

const clock = new T.Clock()
function loop() {
  const dt = Math.min(0.05, clock.getDelta())
  const w = cv.clientWidth, h = cv.clientHeight
  if (cv.width !== Math.floor(w * R.getPixelRatio())) { R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix() }
  if (state.spin && !drag) state.yaw += dt * 0.35
  pivot.rotation.y = state.yaw
  shells.forEach((s) => { s.visible = state.fur })
  R.render(S, cam)
  requestAnimationFrame(loop)
}
loop()
</script>
</body>
