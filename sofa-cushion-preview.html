<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>메인 소파 쿠션 수정 확인</title>
<style>
  body { margin: 0; font: 15px system-ui, sans-serif; background: #faf7f1; color: #322a24; }
  header { padding: 10px 16px; }
  .scene { position: relative; height: calc(100dvh - 78px); }
  iframe { width: 100%; height: 100%; display: block; border: 0; }
  .target {
    pointer-events: none; position: absolute;
    left: calc(50% - (100dvh - 78px) * .375); top: 24%;
    width: calc((100dvh - 78px) * .21); height: calc((100dvh - 78px) * .065);
    transform: translate(-50%, -50%) rotate(-17deg);
    border: 2px solid #f73556; border-radius: 50%;
    box-shadow: 0 0 0 1px white;
  }
  body:has(#show-target:not(:checked)) .target { display: none; }
  p { margin: 5px 0 0; }
</style>
<header>
  <strong>메인 소파 쿠션 수정 확인</strong> · <label><input id="show-target" type="checkbox"> 수정 위치 표시</label>
  <p>무늬 쿠션 뒤의 얇은 돌출부를 정리한 상태입니다.</p>
</header>
<div class="scene">
  <iframe src="/" title="고양이가 올라간 메인 소파"></iframe>
  <span class="target" aria-hidden="true"></span>
</div>
<script type="module">
  import { groundHeight } from '/src/scene/walkable.ts'
  const frame = document.querySelector('iframe')
  const showCat = () => {
    const scene = frame.contentWindow
    if (!scene.__moveCat) {
      requestAnimationFrame(showCat)
      return
    }
    const x = .79
    const z = .88
    scene.__moveCat(x, groundHeight(x, z), z, 1.53, 1.22, 2.1)
  }
  frame.addEventListener('load', showCat)
</script>
