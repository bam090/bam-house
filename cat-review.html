<!doctype html><meta charset="utf-8"><body style="margin:0;max-width:900px;margin:16px auto;font-family:sans-serif">
<!--W-->
<h2 class="sr-only" style="position:absolute;left:-9999px">현재 고양이와 새 고양이 시안을 나란히 돌려 보는 3D 비교 화면</h2>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px">
<button id="bWalk">걷기 보기</button>
<button id="bFur">털 결 끄기</button>
<button id="bSpin">회전 멈춤</button>
<span style="font-size:13px;color:var(--text-secondary)">화면을 끌면 방향이 바뀝니다</span>
</div>
<div style="position:relative">
<canvas id="cv" style="width:100%;height:420px;display:block;border-radius:12px;touch-action:none;cursor:grab"></canvas>
<span style="position:absolute;top:12px;left:25%;transform:translateX(-50%);font-size:13px;font-weight:500;color:#5a4b3a;background:#f4ede2;padding:4px 12px;border-radius:8px">현재</span>
<span style="position:absolute;top:12px;left:75%;transform:translateX(-50%);font-size:13px;font-weight:500;color:#5a4b3a;background:#f4ede2;padding:4px 12px;border-radius:8px">시안</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(function(){
const T=THREE,cv=document.getElementById('cv');
const R=new T.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
R.outputEncoding=T.sRGBEncoding;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=0.82;
R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
const S=new T.Scene();S.background=new T.Color('#b9ab97');
const cam=new T.PerspectiveCamera(30,1,0.1,50);cam.position.set(0,1.0,4.0);cam.lookAt(0,0.55,0);
S.add(new T.HemisphereLight('#fff8ee','#a89880',0.5));
const sun=new T.DirectionalLight('#fff1dc',1.15);sun.position.set(2.5,4,3);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-2.5;sun.shadow.camera.right=2.5;sun.shadow.camera.top=2.5;sun.shadow.camera.bottom=-2.5;sun.shadow.bias=-0.0005;sun.shadow.normalBias=0.02;S.add(sun);
const fill=new T.DirectionalLight('#cfe0ff',0.35);fill.position.set(-3,2,-2);S.add(fill);
const floor=new T.Mesh(new T.CircleGeometry(6,48),new T.MeshStandardMaterial({color:'#8a745c',roughness:1}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;S.add(floor);

const FUR='#fbfaf7',SHADE='#ece8e0',PINK='#f2b8c0',EYE='#3d8fe0',N=8;
const shells=[];
function fur(c){return new T.MeshPhysicalMaterial({color:c,roughness:0.9,sheen:1,sheenRoughness:0.5,sheenColor:new T.Color('#ffffff'),emissive:new T.Color('#fff6ea'),emissiveIntensity:0.22});}
function std(c,r){return new T.MeshStandardMaterial({color:c,roughness:r===undefined?0.6:r});}
function shellMat(c,i,len,freq){
const m=new T.MeshStandardMaterial({color:c,roughness:1,emissive:new T.Color('#fff6ea'),emissiveIntensity:0.2});
const k=(i+1)/N;
m.onBeforeCompile=function(s){
s.uniforms.uOff={value:len*k};s.uniforms.uCut={value:k};s.uniforms.uFreq={value:freq};
s.vertexShader='uniform float uOff;varying vec3 vP;\n'+s.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvP=position;transformed+=normalize(normal)*uOff;');
s.fragmentShader='uniform float uCut;uniform float uFreq;varying vec3 vP;\nfloat h3(vec3 p){p=fract(p*0.3183099+0.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}\n'+s.fragmentShader.replace('#include <color_fragment>','#include <color_fragment>\nvec3 cP=vP*uFreq;vec3 cI=floor(cP);float hh=h3(cI);vec2 cf=fract(cP.xy)-0.5;if(hh<uCut*0.86)discard;diffuseColor.rgb*=mix(0.8,1.0,uCut);');
};
m.customProgramCacheKey=function(){return 'shell';};
return m;}
function mesh(p,g,m,x,y,z){const o=new T.Mesh(g,m);o.position.set(x||0,y||0,z||0);o.castShadow=true;p.add(o);return o;}
function fm(p,g,c,x,y,z,len,freq){if(len<0){len=-len;freq=250;}else if(len){len=Math.min(len,0.01);freq=280;}const o=mesh(p,g,fur(c),x,y,z);
if(len){for(let i=0;i<N;i++){const s=new T.Mesh(g,shellMat(c,i,len,freq||260));o.add(s);shells.push(s);}}
return o;}
const sph=function(r,w,h){return new T.SphereGeometry(r,w||20,h||16);};
const cap=function(r,l){return new T.CapsuleGeometry(r,l,6,14);};

function buildOld(){
const g=new T.Group(),body=new T.Group();g.add(body);
const b=mesh(body,new T.CapsuleGeometry(0.2,0.45,6,12),fur(FUR),0,0.42,0);b.rotation.x=Math.PI/2;
mesh(body,sph(0.2,12,10),fur(SHADE),0,0.4,0.27);
const head=new T.Group();head.position.set(0,0.66,0.4);body.add(head);
mesh(head,sph(0.2,16,12),fur(FUR));
[-1,1].forEach(function(s){
const e=new T.Group();e.position.set(s*0.11,0.17,0);e.rotation.z=s*-0.25;head.add(e);
mesh(e,new T.ConeGeometry(0.07,0.16,4),fur(FUR));
const i=mesh(e,new T.ConeGeometry(0.07,0.16,4),std(PINK),0,-0.01,0.025);i.scale.set(0.6,0.7,0.6);
mesh(head,sph(0.038,10,8),std(EYE,0.2),s*0.085,0.02,0.17);});
mesh(head,sph(0.07,10,8),fur(FUR),0,-0.05,0.17);
mesh(head,sph(0.018,8,6),std(PINK),0,-0.035,0.235);
const tail=new T.Group();tail.position.set(0,0.5,-0.4);body.add(tail);
const t1=mesh(tail,new T.CapsuleGeometry(0.075,0.3,4,10),fur(FUR),0,0.16,-0.1);t1.rotation.x=-0.6;
const t2=mesh(tail,new T.CapsuleGeometry(0.095,0.22,4,10),fur(SHADE),0,0.42,-0.2);t2.rotation.x=-0.15;
const legs=[[-0.13,0.25],[0.13,0.25],[-0.13,-0.25],[0.13,-0.25]].map(function(p){
const l=new T.Group();l.position.set(p[0],0.3,p[1]);g.add(l);
mesh(l,new T.CapsuleGeometry(0.055,0.2,4,8),fur(FUR),0,-0.15,0);return l;});
let ph=0;
g.userData.update=function(t,dt,moving){
if(moving)ph+=dt*14;
legs.forEach(function(l,i){const d=(i===0||i===3)?1:-1;const tg=moving?Math.sin(ph)*0.7*d:0;l.rotation.x+=(tg-l.rotation.x)*Math.min(1,dt*12);});
body.position.y=moving?Math.abs(Math.sin(ph))*0.03:0;
tail.rotation.y=Math.sin(t*2)*0.35;};
return g;}

function buildNew(){
const g=new T.Group(),body=new T.Group();g.add(body);
const pts=[[0.001,-0.44],[0.07,-0.43],[0.115,-0.37],[0.13,-0.27],[0.12,-0.12],[0.122,0],[0.14,0.12],[0.15,0.22],[0.135,0.31],[0.08,0.37],[0.001,0.39]].map(function(p){return new T.Vector2(p[0],p[1]);});
const sp=new T.SplineCurve(pts).getPoints(40);
const torso=fm(body,new T.LatheGeometry(sp,28),FUR,0,0.465,-0.1,-0.024);torso.rotation.x=Math.PI/2;torso.scale.set(0.86,0.87,1.08);
const ruff=fm(body,sph(0.125),FUR,0,0.44,0.14,-0.024);ruff.scale.set(0.9,1.15,1);
const neck=fm(body,new T.CylinderGeometry(0.082,0.118,0.25,24,4),FUR,0,0.565,0.27,-0.016);neck.rotation.x=0.95;
const head=new T.Group();head.position.set(0,0.615,0.4);head.scale.setScalar(0.58);body.add(head);
const skull=fm(head,sph(0.16,28,20),FUR,0,0,0,0.007,260);skull.scale.set(1.08,0.9,1);const bridge=fm(head,sph(0.06,18,14),FUR,0,-0.034,0.13,0.006);bridge.scale.set(0.52,0.7,1.1);
[-1,1].forEach(function(s){
const ck=fm(head,sph(0.06),FUR,s*0.085,-0.05,0.05,0.01);ck.scale.set(1,0.75,0.9);
const pad=fm(head,sph(0.04,16,12),FUR,s*0.024,-0.072,0.166,0.006);pad.scale.set(1.05,0.82,1);
const ear=new T.Group();ear.position.set(s*0.108,0.16,-0.03);ear.rotation.set(-0.1,s*0.3,s*-0.45);head.add(ear);
const eo=fm(ear,new T.ConeGeometry(0.082,0.22,22),FUR,0,0,0,0.012,230);eo.scale.set(1,1,0.42);
const ei=mesh(ear,new T.ConeGeometry(0.056,0.165,18),std('#f5c4c9',0.8),0,-0.018,0.021);ei.scale.set(1,1,0.25);ei.castShadow=false;
[-1,0,1].forEach(function(k){const tf=fm(ear,new T.ConeGeometry(0.008,0.07,6),FUR,k*0.02,-0.055+Math.abs(k)*0.006,0.03);tf.rotation.set(0.35,0,k*-0.35);tf.castShadow=false;});
ear.userData.base=ear.rotation.z;head.userData['ear'+s]=ear;
const eye=new T.Group();eye.position.set(s*0.07,0.012,0.134);eye.rotation.set(-0.05,s*0.42,s*0.3);eye.scale.set(0.9,0.6,0.9);head.add(eye);
const rim=mesh(eye,sph(0.037,24,18),std('#2c5f9e',0.5));rim.scale.set(1,1,0.42);rim.castShadow=false;
const iris=mesh(eye,sph(0.034,24,18),new T.MeshPhysicalMaterial({color:'#5aa9f0',roughness:0.08,clearcoat:1,emissive:new T.Color('#2a78c8'),emissiveIntensity:0.3}),0,0,0.004);iris.scale.set(1,1,0.45);iris.castShadow=false;
const pu=mesh(eye,sph(0.02,20,16),std('#101216',0.15),0,0,0.012);pu.scale.set(0.5,1.25,0.4);pu.castShadow=false;
const hl=mesh(eye,sph(0.0085,10,8),new T.MeshBasicMaterial({color:'#ffffff'}),0.011,0.013,0.019);hl.scale.z=0.5;hl.castShadow=false;
const hl2=mesh(eye,sph(0.004,8,6),new T.MeshBasicMaterial({color:'#ffffff'}),-0.01,-0.011,0.019);hl2.castShadow=false;
head.userData['eye'+s]=eye;
[-1,0,1].forEach(function(k){const w=mesh(head,new T.CylinderGeometry(0.0012,0.0006,0.17,5),new T.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:0.85}),s*0.115,-0.062+k*0.012,0.135);w.rotation.set(0,s*-0.25,Math.PI/2+s*k*0.16);w.castShadow=false;});
});
fm(head,sph(0.03,14,12),FUR,0,-0.104,0.15,0.006);
const nose=mesh(head,sph(0.016,12,10),new T.MeshPhysicalMaterial({color:'#eba0ac',roughness:0.3,clearcoat:0.6}),0,-0.05,0.2);nose.scale.set(1.3,0.85,0.7);nose.castShadow=false;

const tail=[];for(let i=0;i<45;i++){const s=i/44;const r=0.034*(1-s)+0.012;tail.push(fm(body,sph(r,16,12),FUR,0,0,0,0.04,190));}

function seg(p,A,B,rA,rB,len){const d=new T.Vector3().subVectors(A,B);const h=d.length();
const m=fm(p,new T.CylinderGeometry(rA,rB,h,18,4),FUR,(A.x+B.x)/2,(A.y+B.y)/2,(A.z+B.z)/2,len);
m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());fm(p,sph(rB,14,10),FUR,B.x,B.y,B.z,len);return m;}
const V=function(x,y,z){return new T.Vector3(x,y,z);};
function leg(x,z,hind){
const hip=new T.Group();hip.position.set(x,0.42,z);g.add(hip);
if(hind){
const th=fm(hip,sph(0.105),FUR,-x*0.12,-0.02,0.05,-0.018);th.scale.set(0.6,1.3,1.2);th.rotation.x=-0.5;
seg(hip,V(0,-0.09,0.1),V(0,-0.245,-0.085),0.05,0.028,0.008);
seg(hip,V(0,-0.245,-0.085),V(0,-0.385,-0.04),0.028,0.024,0.006);
const paw=fm(hip,sph(0.036,16,12),FUR,0,-0.398,-0.012,0.004);paw.scale.set(1,0.6,1.35);
}else{
seg(hip,V(0,0.02,0),V(0,-0.12,-0.012),0.058,0.04,0.012);
seg(hip,V(0,-0.12,-0.012),V(0,-0.385,0),0.04,0.026,0.008);
const paw=fm(hip,sph(0.036,16,12),FUR,0,-0.398,0.02,0.004);paw.scale.set(1,0.6,1.35);
}
hip.userData.y=0.42;
return {hip:hip};}
const legs=[leg(-0.07,0.17,false),leg(0.07,0.17,false),leg(-0.095,-0.33,true),leg(0.095,-0.33,true)];
let ph=0,w=0;
g.userData.update=function(t,dt,moving){
w+=((moving?1:0)-w)*Math.min(1,dt*8);if(moving)ph+=dt*8.5;
legs.forEach(function(l,i){const d=(i===0||i===3)?0:Math.PI;const a=ph+d;
l.hip.rotation.x=Math.sin(a)*0.3*w;
l.hip.position.y=l.hip.userData.y+Math.max(0,-Math.cos(a))*0.04*w;});
const br=Math.sin(t*1.8)*0.012;
body.position.y=0.02+Math.abs(Math.sin(ph))*0.018*w;
torso.scale.set(0.86*(1+br),0.87,1.08*(1+br));
head.rotation.y=Math.sin(t*0.6)*0.3*(1-w);head.rotation.x=Math.sin(t*0.43)*0.06+Math.sin(ph*2)*0.04*w;
head.rotation.z=Math.sin(t*0.37)*0.08*(1-w);
const bl=(t%3.6)<0.14?0.07:0.6;[-1,1].forEach(function(s){const e=head.userData['eye'+s];e.scale.y+=(bl-e.scale.y)*0.5;
const er=head.userData['ear'+s];const tw=((t+s)%5.2)<0.25?Math.sin(t*40)*0.12:0;er.rotation.z=er.userData.base+tw;});
const amp=0.07+0.05*w,sp2=2+3*w;
tail.forEach(function(m,i){const s=i/44;
m.position.set(Math.sin(t*sp2-s*2.2)*amp*s*s*1.3,0.55+0.47*s,-0.49-0.03*Math.sin(s*2.7));});
};
return g;}

const oldCat=buildOld(),newCat=buildNew();
oldCat.position.x=-0.7;newCat.position.x=0.7;S.add(oldCat,newCat);
let yaw=0.75,spin=true,walk=false,furOn=true,drag=false,lx=0;
cv.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',function(e){if(drag){yaw+=(e.clientX-lx)*0.012;lx=e.clientX;}});
cv.addEventListener('pointerup',function(){drag=false;});
const bW=document.getElementById('bWalk'),bF=document.getElementById('bFur'),bS=document.getElementById('bSpin');
bW.onclick=function(){walk=!walk;bW.textContent=walk?'멈춤 보기':'걷기 보기';};
bF.onclick=function(){furOn=!furOn;shells.forEach(function(s){s.visible=furOn;});bF.textContent=furOn?'털 결 끄기':'털 결 켜기';};
bS.onclick=function(){spin=!spin;bS.textContent=spin?'회전 멈춤':'회전 시작';};
window.__cat={set:function(y,wk,sp){yaw=y;walk=wk;spin=sp;},cam:cam,old:oldCat,neo:newCat,still:false};
function size(){const w=cv.clientWidth||680,h=420;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
size();window.addEventListener('resize',size);
const clock=new T.Clock();
function loop(){const dt=Math.min(0.05,clock.getDelta()),t=clock.elapsedTime;
if(spin&&!drag)yaw+=dt*0.35;
oldCat.rotation.y=yaw;newCat.rotation.y=yaw;
oldCat.userData.update(t,dt,walk);newCat.userData.update(t,dt,walk);
R.render(S,cam);requestAnimationFrame(loop);}
loop();
})();
</script>
<!--/W-->
</body>
